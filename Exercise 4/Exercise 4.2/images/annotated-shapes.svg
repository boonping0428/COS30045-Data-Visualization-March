<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <style>
    .label { font: 20px Arial, sans-serif; fill: #1f3f5b; }
    .callout { fill: none; stroke: #1f3f5b; stroke-width: 2; stroke-dasharray: 6 4; }
    .bubble { fill: #ffffffcc; stroke: #1f3f5b; stroke-width: 2; rx: 12; ry: 12; }
    .background { fill: #f8fbff; }
  </style>
  <rect width="800" height="520" class="background" />
  <rect x="20" y="20" width="760" height="480" rx="26" ry="26" fill="#ffffff" stroke="#a8c8ea" stroke-width="4" />

  <g transform="translate(40,40)">
    <rect x="0" y="180" width="640" height="260" fill="#91c96d" />
    <polygon points="140,60 280,0 420,60" fill="#d95548" stroke="#a63824" stroke-width="5" />
    <rect x="160" y="60" width="280" height="210" rx="18" ry="18" fill="#fce2a3" stroke="#b4782d" stroke-width="6" />
    <circle cx="490" cy="40" r="40" fill="#ffd66b" />
    <ellipse cx="80" cy="210" rx="40" ry="25" fill="#4c8a24" />
    <ellipse cx="120" cy="185" rx="52" ry="30" fill="#78b34d" />
    <line x1="30" y1="210" x2="30" y2="140" stroke="#6a4d28" stroke-width="12" />
    <polyline points="20,150 10,135 40,135 30,150" fill="#4c8a24" />
    <path d="M 220 340 Q 250 300 280 280 T 320 240" fill="none" stroke="#926739" stroke-width="18" stroke-linecap="round" />
    <polyline points="10,340 50,320 90,340 130,320 170,340" fill="none" stroke="#7c5f33" stroke-width="8" stroke-linecap="round" />
    <text x="320" y="50" font-size="28" font-weight="700" text-anchor="middle" fill="#1c3858">My SVG House</text>
    <g transform="translate(200,150)" fill="#8cd3ff" stroke="#1c4e8a" stroke-width="4">
      <rect x="0" y="0" width="55" height="55" rx="10" ry="10" />
      <rect x="100" y="0" width="55" height="55" rx="10" ry="10" />
      <line x1="0" y1="27.5" x2="55" y2="27.5" />
      <line x1="27.5" y1="0" x2="27.5" y2="55" />
      <line x1="100" y1="27.5" x2="155" y2="27.5" />
      <line x1="127.5" y1="0" x2="127.5" y2="55" />
    </g>
  </g>

  <rect x="50" y="320" width="240" height="100" class="bubble" />
  <text x="68" y="355" class="label">rect: house body</text>
  <path d="M 210 345 L 350 220" class="callout" />

  <rect x="435" y="130" width="250" height="100" class="bubble" />
  <text x="453" y="165" class="label">circle: sun</text>
  <path d="M 475 150 L 552 65" class="callout" />

  <rect x="55" y="120" width="260" height="116" class="bubble" />
  <text x="73" y="155" class="label">polygon: roof</text>
  <path d="M 130 160 L 136 70" class="callout" />

  <rect x="54" y="265" width="240" height="92" class="bubble" />
  <text x="72" y="295" class="label">line: tree trunk</text>
  <path d="M 110 235 L 70 170" class="callout" />

  <rect x="400" y="320" width="320" height="92" class="bubble" />
  <text x="418" y="355" class="label">path: garden path</text>
  <path d="M 525 355 L 360 295" class="callout" />

  <rect x="50" y="430" width="380" height="72" class="bubble" />
  <text x="68" y="465" class="label">ellipse: shrubs</text>
  <path d="M 100 405 L 105 265" class="callout" />

  <rect x="440" y="440" width="310" height="60" class="bubble" />
  <text x="458" y="470" class="label">polyline: fence</text>
  <path d="M 160 400 L 110 340" class="callout" />

  <rect x="420" y="220" width="330" height="80" class="bubble" />
  <text x="438" y="255" class="label">text: title label</text>
  <path d="M 250 90 L 485 250" class="callout" />

  <rect x="470" y="120" width="280" height="70" class="bubble" />
  <text x="488" y="155" class="label">g: grouped windows</text>
  <path d="M 320 205 L 520 145" class="callout" />
</svg>